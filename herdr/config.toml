onboarding = false

[theme]
name = "one-dark"

# Paleta Kanagawa (Wave), a juego con Ghostty y con el tema de Claude Code
[theme.custom]
panel_bg = "#1f1f28"     # igual que el fondo de Ghostty
sidebar_bg = "#16161d"
active_row_bg = "#363646"
selection_bg = "#2d4f67"
surface0 = "#2a2a37"
surface1 = "#363646"
surface_dim = "#16161d"
overlay0 = "#727169"
overlay1 = "#938aa9"
text = "#dcd7ba"
subtext0 = "#c8c093"
accent = "#7e9cd8"
blue = "#7e9cd8"
# Colores de estado de los agentes
teal = "#7fb4ca"    # done: terminó y no lo has visto
green = "#98bb6c"   # idle: ya lo viste, en espera
yellow = "#e6c384"  # working: trabajando
peach = "#ffa066"
red = "#ff5d62"     # blocked: espera tu respuesta
mauve = "#957fb8"

[ui]
status_indicators = "symbols"
# Divisores finos compartidos, como los paneles de VS Code
pane_gaps = false
sidebar_width = 30
# Nombre del agente (claude, codex…) en el borde de cada panel dividido
show_agent_labels_on_pane_borders = true
# Pedir nombre al crear un espacio de trabajo
prompt_new_workspace_name = true
# Lista de agentes ordenada por urgencia: primero los que te necesitan
agent_panel_sort = "priority"
# Título de la ventana de Ghostty
window_title = "herdr · {workspace} · {tab}"
# Barra de pestañas con iconos: ZOOM, rama git y hora
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "b=$(git branch --show-current 2>/dev/null); [ -n \"$b\" ] || exit 0; echo \" $b\"", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = " %H:%M" },
]
tab_bar_right_separator = "   "

# Barra lateral estilo explorador de VS Code
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#dcd7ba", bold = true }],
  [{ token = "branch", fg = "#7aa89f" }, { token = "git_status", fg = "#e6c384" }],
]

[ui.sidebar.agents]
# El nombre de la pestaña va junto al icono de estado, para saber de un vistazo cuál te necesita
rows = [
  ["state_icon", { token = "tab", fg = "#dcd7ba", bold = true }, { token = "workspace", fg = "#727169" }],
  [{ token = "agent", fg = "#7e9cd8" }, { token = "terminal_title_stripped", fg = "#727169" }],
]

# Avisos cuando un agente termina o necesita respuesta en otro espacio
[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[keys]
# Atajos directos (sin ctrl+b); los de prefijo siguen funcionando
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
goto = ["prefix+g", "ctrl+alt+g"]
previous_agent = "ctrl+alt+p"
next_agent = "ctrl+alt+n"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+e"
type = "popup"
command = "nvim ."
width = "90%"
height = "90%"

# Guardar lo que se veía en cada panel entre reinicios
[experimental]
pane_history = true
